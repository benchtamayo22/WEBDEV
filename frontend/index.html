<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket Product Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-amber-50 min-h-screen flex flex-col items-center py-10">

    <!-- Header -->
    <header class="w-full bg-green-600 text-white py-4 shadow-md mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center px-6">
            <h1 class="text-3xl font-bold tracking-wide">🛒 Mall Supermarket Inventory</h1>
            <button onclick="openCreateModal()" 
                class="bg-amber-400 hover:bg-amber-500 text-black px-5 py-2 rounded-lg font-semibold transition">
                + Add Product
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="w-full max-w-6xl bg-white shadow-xl rounded-2xl p-8">

        <!-- Table Header -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold text-gray-700">Available Products</h2>
            <input 
                type="text" 
                placeholder="🔍 Search product..." 
                class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none w-64"
                onkeyup="filterProducts(event)">
        </div>

        <!-- Product Table -->
        <div class="overflow-x-auto rounded-lg">
            <table class="w-full border border-gray-200 shadow-sm">
                <thead class="bg-green-100 text-gray-700">
                    <tr>
                        <th class="p-3 border">#</th>
                        <th class="p-3 border">Name</th>
                        <th class="p-3 border">Description</th>
                        <th class="p-3 border">Stock</th>
                        <th class="p-3 border">Unit</th>
                        <th class="p-3 border">Price</th>
                        <th class="p-3 border">Actions</th>
                    </tr>
                </thead>
                <tbody id="productTableBody" class="text-gray-700"></tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6">
            <h2 id="modalTitle" class="text-2xl font-semibold text-green-600 mb-4"></h2>

            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">

                <div class="mb-3">
                    <label class="block text-gray-700 mb-1">Product Name</label>
                    <input id="productName" class="border border-gray-300 p-2 w-full rounded-lg focus:ring-2 focus:ring-green-400" required>
                </div>

                <div class="mb-3">
                    <label class="block text-gray-700 mb-1">Description</label>
                    <textarea id="productDescription" class="border border-gray-300 p-2 w-full rounded-lg focus:ring-2 focus:ring-green-400" required></textarea>
                </div>

                <div class="mb-3 flex gap-2">
                    <div class="w-1/2">
                        <label class="block text-gray-700 mb-1">Stock</label>
                        <input id="productStock" type="number" min="1" class="border border-gray-300 p-2 w-full rounded-lg focus:ring-2 focus:ring-green-400" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-gray-700 mb-1">Unit</label>
                        <input id="productUnit" class="border border-gray-300 p-2 w-full rounded-lg focus:ring-2 focus:ring-green-400" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="block text-gray-700 mb-1">Price (₱)</label>
                    <input id="productPrice" type="number" step="0.01" min="1" class="border border-gray-300 p-2 w-full rounded-lg focus:ring-2 focus:ring-green-400" required>
                </div>

                <div class="flex justify-end gap-3 mt-5">
                    <button type="button" onclick="closeModal()" 
                        class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 transition">
                        Cancel
                    </button>
                    <button type="submit" 
                        class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
